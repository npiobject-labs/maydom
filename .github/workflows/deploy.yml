name: Desplegar backend en Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  desplegar:
    name: Construir y desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Variable de repositorio opcional; si existe, manda sobre el nombre derivado.
      FLY_APP_VAR: ${{ vars.FLY_APP }}
      # Clave de APLICACION del gateway npiobject-labs/openrouter (se crea en su conectar.html).
      # Secreto del repositorio; se vuelca a Fly en cada despliegue y nunca se imprime.
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      # Clave que la app manda en X-Clave para que nadie mas gaste presupuesto desde la URL publica.
      MAYDOM_CLAVE: ${{ secrets.MAYDOM_CLAVE }}
      # Variables opcionales de repositorio: URL del gateway y modelo.
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODELO: ${{ vars.LLM_MODELO }}
    steps:
      # Fly es opcional: sin secreto el workflow termina en verde con un aviso.
      - name: Comprobar si Fly esta configurado
        id: fly
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "Fly no configurado: ver ARRANQUE.md, seccion Fly" >> "$GITHUB_STEP_SUMMARY"
            echo "Fly no configurado: ver ARRANQUE.md, seccion Fly"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
            echo "Token presente (valor oculto)."
          fi

      # Nombre de la app: variable FLY_APP si existe; si no, <repo>-<owner> en
      # minusculas, saneado a [a-z0-9-] y recortado a 30 caracteres.
      - name: Determinar el nombre de la app
        id: app
        if: steps.fly.outputs.configurado == 'true'
        run: |
          if [ -n "${FLY_APP_VAR}" ]; then
            app="${FLY_APP_VAR}"
            origen="variable de repositorio FLY_APP"
          else
            nombre="${GITHUB_REPOSITORY#*/}"
            owner="${GITHUB_REPOSITORY%%/*}"
            app="$(printf '%s-%s' "${nombre}" "${owner}" \
              | tr '[:upper:]' '[:lower:]' \
              | tr -c 'a-z0-9-' '-' \
              | cut -c1-30 \
              | sed 's/-*$//')"
            origen="derivado de ${GITHUB_REPOSITORY}"
          fi
          if [ -z "${app}" ]; then
            echo "::error::No se pudo determinar el nombre de la app de Fly."
            exit 1
          fi
          echo "App de Fly: ${app} (${origen})"
          echo "app=${app}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.fly.outputs.configurado == 'true'
        uses: actions/checkout@v5

      - name: Instalar flyctl
        if: steps.fly.outputs.configurado == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Crear la app si no existe
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl apps create "${FLY_APP}" --org desdemovil || true

      - name: Fijar BUILD_ID con el SHA del commit
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          flyctl secrets set "BUILD_ID=${GITHUB_SHA}" --app "${FLY_APP}" --stage
          if [ -n "${LLM_API_KEY}" ]; then
            flyctl secrets set "LLM_API_KEY=${LLM_API_KEY}" --app "${FLY_APP}" --stage
            echo "LLM_API_KEY pasada a Fly (valor oculto)."
          else
            echo "Sin secreto LLM_API_KEY en el repo: el mayordomo funciona solo con reglas."
          fi
          if [ -n "${MAYDOM_CLAVE}" ]; then
            flyctl secrets set "MAYDOM_CLAVE=${MAYDOM_CLAVE}" --app "${FLY_APP}" --stage
            echo "MAYDOM_CLAVE pasada a Fly (valor oculto)."
          fi
          for par in "LLM_BASE_URL=${LLM_BASE_URL}" "LLM_MODELO=${LLM_MODELO}"; do
            valor="${par#*=}"
            if [ -n "${valor}" ]; then
              flyctl secrets set "${par}" --app "${FLY_APP}" --stage
              echo "${par}"
            fi
          done

      - name: Desplegar en Fly.io
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: flyctl deploy app --app "${FLY_APP}" --remote-only --ha=false

      - name: Verificar /salud
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          SHA: ${{ github.sha }}
        run: |
          url="https://${FLY_APP}.fly.dev/salud"
          echo "Verificando ${url} (se espera build=${SHA})"
          for intento in $(seq 1 10); do
            respuesta="$(curl -fsS --max-time 20 "${url}" || true)"
            echo "Intento ${intento}/10: ${respuesta:-<sin respuesta>}"
            if printf '%s' "${respuesta}" | grep -q "${SHA}"; then
              echo "OK: /salud responde con el build ${SHA}"
              exit 0
            fi
            if [ "${intento}" -lt 10 ]; then
              sleep 15
            fi
          done
          echo "::error::/salud no devolvio el SHA ${SHA} tras 10 intentos (150 s)."
          exit 1

      # Lo que consume docs/holamundo.html desde Pages: cuerpo exacto y CORS.
      - name: Verificar /holamundo
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          url="https://${FLY_APP}.fly.dev/holamundo"
          cabeceras="$(curl -fsS --max-time 20 -D - -o /tmp/cuerpo "${url}")"
          cuerpo="$(cat /tmp/cuerpo)"
          echo "Respuesta: ${cuerpo}"
          [ "${cuerpo}" = "holamundo" ] || { echo "::error::/holamundo devolvio '${cuerpo}'"; exit 1; }
          printf '%s' "${cabeceras}" | grep -qi '^access-control-allow-origin: \*' \
            || { echo "::error::/holamundo sin cabecera CORS"; exit 1; }
          echo "OK: /holamundo responde 'holamundo' con CORS"

      # /api/estado dice si hay LLM y si la app necesita clave. No gasta credito del gateway.
      - name: Verificar /api/estado
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          url="https://${FLY_APP}.fly.dev/api/estado"
          cuerpo="$(curl -fsS --max-time 20 "${url}")"
          echo "Estado: ${cuerpo}"
          printf '%s' "${cuerpo}" | grep -q '"ok":true' || { echo "::error::/api/estado sin ok"; exit 1; }
          if printf '%s' "${cuerpo}" | grep -q '"llm":true'; then
            echo "Mayordomo con LLM (gateway openrouter)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sin LLM_API_KEY: el mayordomo funciona solo con reglas locales (deuda D1 del plan)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # El mayordomo de la app llama a esta ruta desde Pages. Sin LLM_API_KEY responde 503; con clave
      # de aplicacion del gateway, 200 (gasta unos centimos) o el error que devuelva el gateway.
      - name: Verificar /api/mayordomo
        if: steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
          MAYDOM_CLAVE: ${{ secrets.MAYDOM_CLAVE }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          url="https://${FLY_APP}.fly.dev/api/mayordomo"
          codigo="$(curl -sS --max-time 150 -o /tmp/mayordomo -w '%{http_code}' -X POST "${url}" \
            -H 'content-type: application/json' -H "x-clave: ${MAYDOM_CLAVE}" \
            -d '{"operacion":"verificacion","mensajes":[{"rol":"usuario","contenido":"Responde solo: ok"}]}' || true)"
          echo "HTTP ${codigo}: $(head -c 300 /tmp/mayordomo)"
          # Con LLM_API_KEY configurada, el unico resultado bueno es 200. Un 503 del gateway
          # (codigo gateway_sin_configurar) significa que ESE servidor no atiende, y antes se
          # colaba como si fuera el 503 de "aun no hay clave": el run salia verde mintiendo.
          case "${codigo}" in
            200)
              grep -q '"respuesta"' /tmp/mayordomo || { echo "::error::/api/mayordomo 200 sin campo respuesta"; exit 1; }
              echo "OK: mayordomo respondiendo por el gateway" ;;
            503)
              if grep -q '"code":"falta_llm_api_key"' /tmp/mayordomo; then
                if [ -n "${LLM_API_KEY}" ]; then
                  echo "::error::Hay secreto LLM_API_KEY pero el backend dice que no lo tiene: no llego a Fly."
                  exit 1
                fi
                echo "OK: 503 esperado sin LLM_API_KEY"
                echo "Sin LLM_API_KEY: el mayordomo funciona solo con reglas locales (deuda D1 del plan)." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error::El gateway rechaza la llamada: $(head -c 300 /tmp/mayordomo)"
                echo "Revisa que la aplicacion este creada en el mismo servidor al que apunta LLM_BASE_URL y que ese servidor tenga su clave de servicio."
                exit 1
              fi ;;
            401)
              echo "::error::El gateway no reconoce la clave de aplicacion (LLM_API_KEY): $(head -c 300 /tmp/mayordomo)"
              exit 1 ;;
            402|429) echo "::warning::El gateway corto la llamada (presupuesto o cuota): $(head -c 200 /tmp/mayordomo)" ;;
            *) echo "::error::/api/mayordomo devolvio HTTP ${codigo}: $(head -c 300 /tmp/mayordomo)"; exit 1 ;;
          esac
          cabeceras="$(curl -sS --max-time 20 -D - -o /dev/null -X OPTIONS "${url}")"
          printf '%s' "${cabeceras}" | grep -qi '^access-control-allow-origin: \*' || { echo "::error::/api/mayordomo sin CORS en OPTIONS"; exit 1; }
          printf '%s' "${cabeceras}" | grep -qi '^access-control-allow-headers: .*x-clave' || { echo "::error::/api/mayordomo sin x-clave en el preflight"; exit 1; }
          if [ -n "${MAYDOM_CLAVE}" ]; then
            codigo="$(curl -sS --max-time 30 -o /tmp/sinclave -w '%{http_code}' -X POST "${url}" -H 'content-type: application/json' -d '{"mensajes":[{"rol":"usuario","contenido":"hola"}]}' || true)"
            [ "${codigo}" = "401" ] || { echo "::error::con MAYDOM_CLAVE configurada, una llamada sin clave devolvio ${codigo}"; exit 1; }
            echo "OK: sin X-Clave responde 401"
          fi

      - name: Resumen del despliegue
        if: success() && steps.fly.outputs.configurado == 'true'
        env:
          FLY_APP: ${{ steps.app.outputs.app }}
        run: |
          region="$(sed -n 's/^primary_region *= *"\(.*\)"/\1/p' app/fly.toml)"
          {
            echo "### Backend desplegado en Fly.io"
            echo ""
            echo "- App: \`${FLY_APP}\` (region \`${region}\`)"
            echo "- URL: https://${FLY_APP}.fly.dev/"
            echo "- Salud: https://${FLY_APP}.fly.dev/salud"
            echo "- Hola mundo: https://${FLY_APP}.fly.dev/holamundo"
            echo "- Mayordomo: POST https://${FLY_APP}.fly.dev/api/mayordomo · estado: /api/estado"
            echo "- Comprobacion desde Pages: https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/holamundo.html"
            echo "- Build (SHA): \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
