# Diagnóstico temporal: qué devuelve el modelo real a ejercicio-relato. Se borra al terminar.
name: Diagnóstico ejercicio-relato
on:
  push:
    branches: [claude/bold-newton-gq4pr4]
    paths: ['.github/diag/**', '.github/workflows/diag-ejercicio.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Llamar a /api/mayordomo con los cuerpos que manda la app
        env:
          FLY_APP: ${{ vars.FLY_APP || 'maydom-npiobject-labs' }}
          MAYDOM_CLAVE: ${{ secrets.MAYDOM_CLAVE }}
        run: |
          for f in .github/diag/cuerpo*.json; do
            for i in 1 2; do
              echo "=== ${f} · intento ${i}"
              curl -sS --max-time 150 -X POST "https://${FLY_APP}.fly.dev/api/mayordomo" \
                -H 'content-type: application/json' -H "x-clave: ${MAYDOM_CLAVE}" -d @"${f}" -w '\nHTTP %{http_code}\n'
            done
          done
