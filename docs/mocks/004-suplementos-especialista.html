const $ = s => document.querySelector(s);
const aMin = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
const hhmm = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
// Planificador local (§5.4): el modelo no da horas, da anclas con desfase; la hora sale de la jornada.
function base(a) {
  switch (a) {
    case 'al_levantarse': return aMin(J.levantarse);
    case 'desayuno': return aMin(J.desayuno);
    case 'comida': return aMin(J.comida);
    case 'cena': return aMin(J.cena);
    case 'antes_de_dormir': return aMin(J.acostarse);
    case 'pre_entreno': return aMin(J.entreno.hora);
    case 'post_entreno': return aMin(J.entreno.hora) + J.entreno.dur;
  }
}
const hora = x => hhmm(base(x.a) + (x.d || 0));
const desc = x => x.d ? `${Math.abs(x.d)} min ${x.d < 0 ? 'antes' : 'después'} de ${ANCLAS[x.a].de}` : ANCLAS[x.a].l;
const diasTxt = x => x.dias === 'entreno' ? ' · días de entreno' : x.dias === 'descanso' ? ' · días de descanso' : '';
const anclasDe = (s, modo) => s.ia.accion === 'suspender' ? [] : (modo === 'sencilla' && s.ia.sencilla ? s.ia.sencilla.anclas : s.ia.anclas);
function tomasDelDia(tipo, modo) {
  const g = {};
  for (const s of S) for (const x of anclasDe(s, modo)) {
    if (x.dias !== 'todos' && x.dias !== tipo) continue;
    const k = x.a + '|' + (x.d || 0);
    (g[k] ||= { a: x.a, d: x.d || 0, items: [] }).items.push(s);
  }
  return Object.values(g).sort((p, q) => (base(p.a) + p.d) - (base(q.a) + q.d));
}
const iaTexto = (s, modo = 'optima') => { const an = anclasDe(s, modo); return an.length ? an.map(x => `${desc(x)} · ${hora(x)}${diasTxt(x)}`).join('<br>') : 'Suspender'; };
const iaCorto = s => { const an = anclasDe(s, 'optima'); return an.length ? an.map(x => `${ANCLAS[x.a].l} ${hora(x)}`).join(' / ') : 'suspender'; };
const dots = n => '<span class="dots">' + '<i>●</i>'.repeat(n) + '○'.repeat(3 - n) + '</span>';
const EVN = ['—', 'baja', 'moderada', 'alta'];
const ACC = { ajustar: ['Ajustar', 'ia'], mantener: ['Mantener', 'ok'], suspender: ['Suspender', 'm'], preguntar: ['Preguntar', 'w'] };
function toast(t, ms = 2400) { const e = $('#toast'); e.textContent = t; e.classList.add('ver'); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove('ver'), ms); }

  <div class="tarjeta">${PREGUNTAS.map((p, i) => `<label>${i + 1}. ${p.t}<input placeholder="${p.ph}"></label>`).join('')}
    <div class="acciones"><button class="btn ia-l" onclick="toast('Se pide otra pauta con las respuestas y se compara con esta: solo vuelve como propuesta lo que cambie')">✦ Rehacer con las respuestas</button></div></div>

  <h3>Cada suplemento <span class="sp"></span><span class="n mini" id="cuenta">${pendientes().length} por decidir</span></h3>
  ${lista.map(tarjeta).join('')}

  <h3>Para hablar con tu médico</h3>
  <div class="tarjeta"><ul class="l">${MEDICO.map(m => `<li>${m}</li>`).join('')}</ul>
    <div class="acciones"><button class="btn mini" onclick="toast('En la app: copia la lista con la pauta para enseñarla en la consulta')">Copiar para la consulta</button></div></div>

  <h3>Comprobación local <span class="sp"></span><span class="n mini">sin IA · la tabla manda</span></h3>
  <div class="tarjeta">
    <div class="check"><span class="s">✓</span><span>14 de 14 suplementos con su id: ninguno inventado ni perdido.</span></div>
    <div class="check"><span class="s">✓</span><span>«Fijado por mí» respetado (Proteína whey).</span></div>
    <div class="check"><span class="s">✓</span><span>Separaciones de la tabla: ningún choque (no hay hierro ni calcio sueltos).</span></div>
    <div class="check"><span class="s">⚠️</span><span>Sumas por nutriente con la propuesta, frente al límite diario:</span></div>
    ${barra('Vitamina D (multi + D3)', 75, 100, 'µg')}${barra('Zinc (media, días alternos)', 22.5, 25, 'mg')}${barra('B6 (sin el Complejo B)', 5, 12, 'mg')}${barra('Magnesio suplementado', 300, 250, 'mg')}
    <p class="mini">La marca negra es el límite. Lo que lo pasa no tiene botón de «Aceptar» a secas.</p>
  </div>

  <div class="banda"><span class="t">Aceptar todo acepta lo que no lleva aviso ni pregunta; eso queda para ti.</span><button class="btn ia" id="aceptar-todo">Aceptar todo</button></div>`;
}

// ─────────────────────────── Pantalla 4: ficha ───────────────────────────
function vFicha() {
  const s = S.find(x => x.id === st.fichaId);
  return `
  <div class="aviso-mock">La ficha de un suplemento con las dos opciones nuevas: <b>«✦ Según la IA»</b> en el momento de toma y <b>«✦ La de la IA»</b> en la dosis. En la app es una ventana; aquí también se abre al tocar un suplemento en la pantalla 1.</div>
  <div class="tarjeta"><div class="cabecera-modal"><h2>${s.nombre}</h2></div>${fichaForm(s)}</div>
  <label>Ver otra ficha<select id="otra-ficha">${S.map(x => `<option value="${x.id}" ${x.id === s.id ? 'selected' : ''}>${x.nombre}</option>`).join('')}</select></label>`;
}
function fichaForm(s) {
  const dIA = st.dec[s.id] !== 'mia';
  const tomaIA = s.ia.accion === 'suspender' ? 'la pauta propone suspenderlo' : iaTexto(s).replace(/<br>/g, ' / ');
  const hoy = !st.pedida ? `<p class="mini" style="color:var(--ia)">Aún no hay pauta: «✦ Según la IA» se llena al pedirla.</p>` : '';
  return `${hoy}
    <label>Suplemento<input value="${s.nombre}"></label>
    <label>Para qué lo tomo <span class="pill g">nuevo</span><input value="${s.obj}"></label>
    <label>Composición por unidad <span class="pill g">nuevo · opcional</span><input value="${s.comp}" placeholder="1 cáps. = 100 mg de magnesio (bisglicinato)"><span class="mini">Con ella la dosis de la IA se dice en cápsulas o cacitos; sin ella, en mg. En la fase 2, con una foto de la etiqueta.</span></label>
    <label>Dosis</label>
    <label class="opcion ${dIA ? 'on' : ''}"><input type="radio" name="dosis-${s.id}" ${dIA ? 'checked' : ''}><span><b>✦ La de la IA</b>: ${s.ia.dosis}<span class="mini">${s.ia.motivo.split('. ')[0]}.</span></span></label>
    <label class="opcion ${!dIA ? 'on' : ''}"><input type="radio" name="dosis-${s.id}" ${!dIA ? 'checked' : ''}><span><b>La mía</b><input value="${s.ahora.dosis}"></span></label>
    <label>Momento de toma<select id="mom-${s.id}">
      <option value="ia" ${dIA ? 'selected' : ''}>✦ Según la IA — ${tomaIA}</option>
      <option>Mañana</option><option>Con la comida</option><option>Tarde</option><option>Noche</option><option ${s.fijo ? 'selected' : ''}>Fijado por mí</option></select></label>
    <label>Hora del aviso<input type="time" id="hora-${s.id}" value="${(anclasDe(s, 'optima')[0] && hora(anclasDe(s, 'optima')[0])) || s.ahora.hora}" ${dIA ? 'disabled' : ''}><span class="mini" id="hora-nota-${s.id}">${dIA ? 'La pone la pauta con tu jornada; si cambias la hora de cenar, se mueve sola.' : 'La pones tú.'}</span></label>
    <p class="mini" style="margin-top:.6rem">Una pauta nueva nunca cambia esto sola: si propone otra cosa, vuelve como propuesta. «Fijado por mí» no lo toca nunca.</p>
    <details class="plegable aparcado"><summary>📦 Stock y reposición <span class="pill g">aparcado en esta fase</span></summary><div class="cuerpo">
      <div class="rej2"><label>Unidades que quedan<input type="number" disabled value="42"></label><label>Envase completo<input type="number" disabled value="60"></label></div>
      <label>Avisar al llegar al (%)<input type="number" disabled value="10"></label>
      <p class="mini">Fase 3: se descontará con la dosis aceptada, en cápsulas o gramos.</p></div></details>
    <div class="acciones" style="justify-content:flex-end"><button class="btn" data-cerrar>Cancelar</button><button class="btn p" data-cerrar onclick="toast('Guardado (mock)')">Guardar</button></div>`;
}

// ─────────────────────────── Pantalla 5: por qué así ───────────────────────────
function vDiseno() {
  return `
  <div class="aviso-mock">Resumen del análisis. El documento completo está en el repo: <a href="https://github.com/npiobject-labs/maydom/blob/main/docs/planificacion/suplementos-especialista.md">docs/planificacion/suplementos-especialista.md</a>.</div>
  <h3>Qué falla hoy en «Revisar horario con LLM»</h3>
  <div class="tarjeta"><ul class="l">
    <li>Lo resuelve <b>gemini-2.5-flash-lite</b>, el modelo por defecto del gateway, elegido porque mapeaba bien columnas de un BOM. Para farmacología no se ha medido.</li>
    <li>Usa el prompt del mayordomo: <b>120 palabras y 3 puntos como máximo</b>. Encima, 2000 tokens de salida y el resumen de toda la app de contexto.</li>
    <li>Solo sabe decir «mañana, comida, tarde, noche»: <b>ni dosis</b>, ni entreno, ni «45 min antes de acostarte».</li>
    <li>Empareja por <b>nombre exacto</b> y <b>aplica los cambios sin preguntar</b>, contra el principio «aconsejar, no imponer».</li>
    <li>No sabe qué lleva cada producto ni qué medicación tomas: <b>no puede ver</b> el exceso de zinc y B6 del multivitamínico ni los choques con fármacos.</li>
  </ul></div>
  <h3>Cómo se resuelve</h3>
  <div class="flujo">
    <div class="paso"><span class="num">1</span><span><b>Tus datos</b>Jornada, entreno, sueño, perfil de salud opcional, objetivos y cada suplemento con su id, su composición y para qué lo tomas.</span></div><div class="flecha">↓</div>
    <div class="paso ia"><span class="num">2</span><span><b>Especialista (LLM potente)</b>Con un prompt propio, sin límite de palabras, y los hechos de la tabla delante. Devuelve qué tomar, cuánto y en qué momento (anclas), avisos, evidencia y preguntas, en un JSON con esquema.</span></div><div class="flecha">↓</div>
    <div class="paso"><span class="num">3</span><span><b>Comprobación local</b>Suma cada nutriente entre productos, comprueba los límites EFSA, las separaciones, los id y lo fijado. Si choca con el modelo, manda la tabla.</span></div><div class="flecha">↓</div>
    <div class="paso"><span class="num">4</span><span><b>Planificador de horas</b>Ancla + desfase + tu jornada = la hora, distinta en días de entreno y de descanso, en versión óptima o sencilla. Si cambias la jornada, no hace falta llamar otra vez a la IA.</span></div><div class="flecha">↓</div>
    <div class="paso"><span class="num">5</span><span><b>Tú decides</b>Aceptar, mantener la tuya o fijar a mano, uno a uno. «✦ IA» en hora y dosis de la ficha. Nada cambia solo.</span></div>
  </div>
  <h3>El modelo</h3>
  <div class="tarjeta">
    <table class="t"><tr><th>Candidato</th><th>$/M entrada · salida</th><th>Una pauta</th></tr>
      <tr><td>gemini-2.5-flash-lite (hoy)</td><td>céntimos</td><td>&lt; 0,01 $</td></tr>
      <tr><td>Claude Sonnet 5</td><td>2 · 10</td><td>≈ 0,10–0,15 $</td></tr>
      <tr class="rec"><td><b>Claude Opus 5.5</b> ✦</td><td>4 · 20</td><td>≈ 0,20–0,30 $</td></tr>
      <tr><td>Claude Fable 5.1</td><td>10 · 50</td><td>≈ 0,50–0,80 $</td></tr></table>
    <p class="txt">Unas 4 pautas al mes salen por menos de 1,5 $, así que <b>el precio no decide</b>. Lo que limita es el tiempo: el gateway corta a los 120 s, y por eso las horas se calculan en la app. El modelo lo elige el backend (variable <code>LLM_MODELO_SUPLEMENTOS</code>), nunca el navegador.</p>
    <p class="txt">Se elige <b>midiendo</b>: un workflow lanza cuatro casos contra los candidatos (este, uno con anticoagulante, otro con levotiroxina + hierro + calcio y otro vegano que entrena por la mañana) y puntúa esquema, límites, choques que tiene que ver, id y tiempo. El del anticoagulante es eliminatorio.</p>
  </div>
  <h3>Contrato de salida (extracto)</h3>
  <pre>{ "id": "s4", "accion": "ajustar",
  "dosis": { "cantidad": 200, "unidad": "mg",
             "texto": "200 mg (2 cápsulas)" },
  "anclas": [{ "ancla": "antes_de_dormir",
               "desfase_min": -45, "dias": "todos" }],
  "sencilla": { … }, "motivo": "…",
  "evidencia": { "dosis": "moderada", "hora": "baja" },
  "medico": false }</pre>
  <h3>Fases</h3>
  <div class="tarjeta"><ul class="l">
    <li><b>1 · Pauta</b> (esto): jornada, perfil y composición, el agente, la tabla local, el planificador, la vista de pauta y «✦ IA» en hora y dosis. Más la evaluación de modelos.</li>
    <li><b>2 · Tomas</b>: Hoy agrupado por toma («✓ todo lo de la cena»), foto de la etiqueta y ciclos.</li>
    <li><b>3 · Stock</b>: pastillas y gramos a partir de la dosis. Aparcado.</li>
  </ul></div>
  <h3>Supuestos <span class="sp"></span><span class="n mini">con plan B en el documento</span></h3>
  <div class="tarjeta"><ul class="l">
    <li>[SUPUESTO] El identificador exacto de Opus 5.5 en OpenRouter: se saca de <code>GET /v1/models</code> del gateway.</li>
    <li>[SUPUESTO] Que una pauta de 14 productos cabe en 120 s; si no, razonamiento bajo, Sonnet 5 o más tiempo en el gateway.</li>
    <li>[SUPUESTO] Que el gateway deja pasar <code>reasoning</code> y <code>provider</code>: reenvía el cuerpo tal cual.</li>
    <li>[SUPUESTO] Los límites de hierro y de melatonina en España: se comprueban antes de escribirlos en la tabla.</li>
  </ul></div>`;
}

// ─────────────────────────── Router y eventos ───────────────────────────
const VISTAS = { lista: ['💊 Suplementos', vLista], preparar: ['✦ Preparar la pauta', vPreparar], pauta: ['✦ Pauta del especialista', vPauta], ficha: ['Ficha del suplemento', vFicha], diseno: ['Por qué así', vDiseno] };
function pintar() {
  const v = (location.hash || '#lista').slice(1); const [t, f] = VISTAS[v] || VISTAS.lista;
  $('#titulo').textContent = t; $('#main').innerHTML = f();
  $('#volver').hidden = v === 'lista';
  document.querySelectorAll('#pantallas a').forEach(a => a.classList.toggle('activo', a.getAttribute('href') === '#' + (VISTAS[v] ? v : 'lista')));
}
const repintar = () => { const y = scrollY; pintar(); scrollTo(0, y); };
addEventListener('hashchange', () => { pintar(); scrollTo(0, 0); });
$('#volver').onclick = () => { location.hash = '#lista'; };

function abrirFicha(id) { st.fichaId = id; const s = S.find(x => x.id === id); $('#ficha-titulo').textContent = s.nombre; $('#ficha-cuerpo').innerHTML = fichaForm(s); $('#dlg-ficha').showModal(); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-ficha],[data-aceptar],[data-mia],[data-deshacer],[data-tipo],[data-modo],[data-obj],[data-dia],[data-tomar],[data-cerrar],#pedir,#aceptar-todo');
  if (!el) return;
  const d = el.dataset;
  if ('cerrar' in d) { el.closest('dialog')?.close(); return; }
  if (d.ficha) { if (location.hash === '#ficha') { st.fichaId = d.ficha; repintar(); } else abrirFicha(d.ficha); return; }
  if (d.aceptar) { st.dec[d.aceptar] = 'ia'; repintar(); toast('Aceptada: en la ficha queda «✦ Según la IA»'); return; }
  if (d.mia) { st.dec[d.mia] = 'mia'; repintar(); return; }
  if (d.deshacer) { delete st.dec[d.deshacer]; repintar(); return; }
  if (d.tipo) { st.tipo = d.tipo; repintar(); return; }
  if (d.modo) { st.modo = d.modo; repintar(); return; }
  if (d.obj) { st.objetivos.has(d.obj) ? st.objetivos.delete(d.obj) : st.objetivos.add(d.obj); repintar(); return; }
  if (d.dia) { const i = Number(d.dia); st.diasPrep.has(i) ? st.diasPrep.delete(i) : st.diasPrep.add(i); J.entreno.dias = [...st.diasPrep].sort(); repintar(); return; }
  if ('tomar' in d) { d.txt ||= el.textContent; el.classList.toggle('hecho'); el.textContent = el.classList.contains('hecho') ? '✓ hecho' : d.txt; return; }
  if (el.id === 'pedir') { pedir(); return; }
  if (el.id === 'aceptar-todo') {
    let n = 0; for (const s of S) if (!st.dec[s.id] && s.ia.accion !== 'mantener' && !s.ia.limite && s.ia.accion !== 'preguntar') { st.dec[s.id] = 'ia'; n++; }
    repintar(); toast(`${n} aceptadas; quedan ${pendientes().length} que tienes que mirar tú (aviso o pregunta)`, 3500);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.j) { if (t.dataset.j === 'entreno') J.entreno.hora = t.value; else J[t.dataset.j] = t.value; toast('Jornada cambiada: la pauta se recoloca sin llamar a la IA'); return; }
  if (t.name === 'modelo') { st.modelo = t.value; repintar(); return; }
  if (t.id === 'otra-ficha') { st.fichaId = t.value; repintar(); return; }
  if (t.id?.startsWith('mom-')) {
    const id = t.id.slice(4); const ia = t.value === 'ia'; const h = document.getElementById('hora-' + id); h.disabled = ia;
    document.getElementById('hora-nota-' + id).textContent = ia ? 'La pone la pauta con tu jornada; si cambias la hora de cenar, se mueve sola.' : 'La pones tú.';
  }
  if (t.type === 'radio' && t.name.startsWith('dosis-')) t.closest('div,.tarjeta,dialog').querySelectorAll('.opcion').forEach(o => o.classList.toggle('on', o.contains(t)));
});
$('#dlg-ficha').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

function pedir() {
  const pasos = st.modelo === 'rapido'
    ? ['Reuniendo jornada, sueño y 14 suplementos', 'Consultando al modelo rápido (flash-lite)', 'Comprobando límites y choques con la tabla', 'Calculando las horas con tu jornada']
    : ['Reuniendo jornada, sueño y 14 suplementos', 'Consultando al especialista (Opus 5.5, razonamiento medio)', 'Comprobando límites y choques con la tabla', 'Calculando las horas con tu jornada'];
  $('#prog-modelo').textContent = st.modelo === 'rapido' ? 'Modelo rápido · < 0,01 $' : 'Especialista · ≈ 0,22 $ · operación maydom-suplementos-pauta';
  const ul = $('#prog-lista'); ul.innerHTML = pasos.map(p => `<li><span class="s">○</span>${p}</li>`).join('');
  const dlg = $('#dlg-progreso'); dlg.showModal();
  const lis = [...ul.children]; let i = 0;
  const paso = () => {
    if (i > 0) { lis[i - 1].className = 'hecho'; lis[i - 1].firstChild.textContent = '✓'; }
    if (i === lis.length) { setTimeout(() => { dlg.close(); st.pedida = true; st.dec = {}; location.hash = '#pauta'; }, 350); return; }
    lis[i].className = 'act'; lis[i].firstChild.textContent = '◌'; i++;
    setTimeout(paso, i === 2 ? 1400 : 600);
  };
  paso();
}
pintar();
</script>
</body>
</html>
